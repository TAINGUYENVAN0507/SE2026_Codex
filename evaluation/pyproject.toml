[project]
name = "meeting-eval"
version = "0.1.0"
description = "Dữ liệu và công cụ đánh giá (WER, noisy, DER, rubric) cho Vietnamese Meeting Minutes Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["datasets/tests", "normalizer"]
pythonpath = ["datasets", "normalizer"]
addopts = "-ra --strict-markers --import-mode=importlib --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
