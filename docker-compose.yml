services:
  db:
    image: postgres:16
    container_name: meeting_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: meeting_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: meeting_assistant_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/meeting_assistant
      ENVIRONMENT: development
      STORAGE_DIR: /app/backend/appdata
      API_WORKERS: 1
    command: >
      sh -c "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-1}"
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/backend/appdata
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: meeting_assistant_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/meeting_assistant
      STORAGE_DIR: /app/backend/appdata
      PIPELINE_BACKEND: fake
      ENVIRONMENT: development
    command: ["python", "-m", "app.worker.runner"]
    volumes:
      - appdata:/app/backend/appdata
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from app.db.session import get_engine; from sqlalchemy import text; conn = get_engine().connect(); conn.execute(text('SELECT 1')); conn.close()\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: meeting_assistant_web
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  appdata:
