name: worker-image

# Build image worker bản CPU và chạy smoke test trong container (AI-16). Chỉ chạy khi đổi
# Dockerfile hoặc dependency, vì mỗi lần build tải torch và runtime của model.
on:
  pull_request:
    paths:
      - "infra/docker/**"
      - ".dockerignore"
      - "pipeline/pyproject.toml"
      - "pipeline/uv.lock"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/worker-image.yml"
  push:
    branches: [main]
    paths:
      - "infra/docker/**"
      - ".dockerignore"
      - "pipeline/pyproject.toml"
      - "pipeline/uv.lock"
      - "backend/pyproject.toml"
      - "backend/uv.lock"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/docker/worker.Dockerfile

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          build-args: VARIANT=${{ matrix.variant }}
          tags: meeting-worker:${{ matrix.variant }}
          load: true
          cache-from: type=gha,scope=worker-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=worker-${{ matrix.variant }}
      - name: Smoke test trong container (không cần GPU)
        run: |
          docker run --rm --network none \
            -v "$PWD/infra/docker/smoke_worker.sh:/smoke.sh:ro" \
            meeting-worker:${{ matrix.variant }} sh /smoke.sh
      - name: Kích thước image
        run: docker image ls meeting-worker:${{ matrix.variant }}
