name: worker-image

# Build image worker bản CPU và chạy smoke test trong container (AI-16). Chỉ chạy khi đổi
# Dockerfile hoặc dependency, vì mỗi lần build tải torch và runtime của model.
on:
  pull_request:
    paths:
      - "infra/docker/**"
      - ".dockerignore"
      - "pipeline/pyproject.toml"
      - "pipeline/uv.lock"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/worker-image.yml"
  push:
    branches: [main]
    paths:
      - "infra/docker/**"
      - ".dockerignore"
      - "pipeline/pyproject.toml"
      - "pipeline/uv.lock"
      - "backend/pyproject.toml"
      - "backend/uv.lock"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image CPU
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          tags: meeting-worker:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test trong container
        run: |
          docker run --rm --network none \
            -v "$PWD/infra/docker/smoke_worker.sh:/smoke.sh:ro" \
            meeting-worker:ci sh /smoke.sh
      - name: Kích thước image
        run: docker image ls meeting-worker:ci
