name: web-container-e2e
on:
  workflow_dispatch:
  pull_request:
    paths: ['frontend/**', 'backend/**', 'pipeline/**', 'contracts/**', 'infra/**', 'docker-compose.yml', '.github/workflows/web-container-e2e.yml']
  push:
    branches: [main, vantuong-compose-proof-20261110]
    paths: ['frontend/**', 'backend/**', 'pipeline/**', 'contracts/**', 'infra/**', 'docker-compose.yml', '.github/workflows/web-container-e2e.yml']
permissions:
  contents: read
jobs:
  chromium-nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: se-web-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Generate synthetic password
        run: echo "COMPOSE_E2E_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start isolated Compose stack
        run: docker compose -p se-web-e2e -f docker-compose.yml -f frontend/e2e/compose/override.yml up --build -d --wait --wait-timeout 180
      - name: Seed synthetic user
        run: node frontend/e2e/compose/seed.mjs
      - name: Playwright through nginx
        working-directory: frontend
        run: npm run e2e:compose
      - name: Container logs on failure
        if: failure()
        run: docker compose -p se-web-e2e -f docker-compose.yml -f frontend/e2e/compose/override.yml logs --no-color api worker web db
      - name: Failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-container-e2e
          path: |
            frontend/test-results/compose/
            frontend/playwright-report/compose/
          retention-days: 7
      - name: Stop isolated test stack
        if: always()
        run: docker compose -p se-web-e2e -f docker-compose.yml -f frontend/e2e/compose/override.yml down -v --remove-orphans
