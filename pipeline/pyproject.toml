[project]
name = "meeting-pipeline"
version = "0.1.0"
description = "AI/Speech pipeline cho Vietnamese Meeting Minutes Assistant: preprocess, VAD, ASR, diarization, merge, summarize"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Các stage dùng model thật. Cài riêng trên máy có GPU, CI không cài.
asr = [
    "faster-whisper>=1.2,<2",
    "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
]
# torch bản CPU từ index của PyTorch: bản trên PyPI kèm CUDA 13 (vài GB), cuDNN của nó ghi
# đè cuDNN cho CUDA 12 mà CTranslate2 (extra asr) cần. Bản GPU sẽ cấu hình ở AI-16.
diarize = [
    "pyannote.audio>=4.0,<5",
    "torch>=2.8",
    "torchaudio>=2.8",
]
llm = ["anthropic>=0.70"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeting_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "model: cần model thật hoặc GPU, chỉ chạy thủ công",
    "ffmpeg: cần ffmpeg/ffprobe trong PATH",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
