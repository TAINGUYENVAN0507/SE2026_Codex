server {
    listen 8080;
    server_name localhost;

    # Cho phép tải tệp âm thanh tối đa 250MB (phù hợp giới hạn MAX_UPLOAD_MB=200 của hệ thống)
    client_max_body_size 250M;

    # Giao diện frontend tĩnh (SPA React)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy các lời gọi API tới backend service
    location /api/ {
        proxy_pass http://api:1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Proxy endpoint kiểm tra sức khỏe
    location /health {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Bảo mật thông tin vận hành (PRIV-10): tuyệt đối KHÔNG proxy endpoint /metrics ra ngoài
    location /metrics {
        return 404;
    }
}

